
name: Spanish Flashcards Bot

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

# Allow the workflow to save its progress to the repository
permissions:
  contents: write

# Prevent two runs from updating the word list at the same time
concurrency:
  group: spanish-flashcards-bot
  cancel-in-progress: false

jobs:
  send-vocabulary:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        run: |
          if [ -z "$BOT_TOKEN" ]; then echo "BOT_TOKEN is missing"; exit 1; fi
          if [ -z "$CHANNEL_ID" ]; then echo "CHANNEL_ID is missing"; exit 1; fi
          echo "Both secrets are available."

      - name: Run vocabulary bot
        run: python bot.py

      - name: Save vocabulary progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update vocabulary progress"
            git push
          else
            echo "No vocabulary progress changes to save."
          fi
